[project]
name = "holden-reel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "opencv-python-headless>=4.10,<5",
  "platformdirs",
  "pydantic-settings",
  "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holden_reel"]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
