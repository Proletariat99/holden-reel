[project]
name = "holden-reel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "platformdirs",
  "pydantic-settings",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "httpx",
  "httpx2",
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
